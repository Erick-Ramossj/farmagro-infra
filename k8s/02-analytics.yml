# Backend 2 — Flask + Pandas (analytics API). Runs on the node labelled role=analitico.
# One replica on purpose: Prometheus scrapes it through the NodePort, and with several replicas
# every scrape would land on a different pod and rate() would jump.
# The Secret farmagro-analytics-secret is created by deploy.sh from .env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: farmagro-analytics-config
  namespace: farmagro
data:
  APP_PORT: "8000"
  MONGODB_DATABASE: "farmagro_s4"
  SQLSERVER_PORT: "1433"
  SQLSERVER_DATABASE: "FARMAGRO_SA"
  GUNICORN_WORKERS: "2"
  TZ: "America/Lima"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend2
  namespace: farmagro
  labels:
    app: backend2
    app.kubernetes.io/part-of: farmagro-abp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend2
  template:
    metadata:
      labels:
        app: backend2
    spec:
      nodeSelector:
        role: analitico
      tolerations:
        - key: role
          operator: Equal
          value: analitico
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: backend2
          image: erickramoss/farmagro-ba:eva-final@sha256:9b918a81080b02bfb0014b690877f93797d688e82c4ec6f2fe1479d1aa4cd5b2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: farmagro-analytics-secret
            - configMapRef:
                name: farmagro-analytics-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: farmagro-analitico
  namespace: farmagro
  labels:
    app: backend2
spec:
  type: NodePort
  selector:
    app: backend2
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30082
