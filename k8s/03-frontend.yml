# Frontend — React served by nginx. Runs on the control node (role=frontend), which is also where
# scenario 3 saturates the node: the requests below are large enough for ~10 pods to fit.
# __BACKEND_UPSTREAM__ and __ANALYTICS_UPSTREAM__ are filled in by deploy.sh. nginx resolves them
# at request time with the cluster DNS, which does not use search domains, hence the full names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: farmagro
  labels:
    app: frontend
    app.kubernetes.io/part-of: farmagro-abp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        role: frontend
      tolerations:
        - key: role
          operator: Equal
          value: frontend
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: erickramoss/farmagro-fe:eva-final@sha256:6cf931fecafe602d47557e2af6aec1dca437a1ad8a873210e4021842eb924602
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_UPSTREAM
              value: "__BACKEND_UPSTREAM__"
            - name: ANALYTICS_UPSTREAM
              value: "__ANALYTICS_UPSTREAM__"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: farmagro-frontend
  namespace: farmagro
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
