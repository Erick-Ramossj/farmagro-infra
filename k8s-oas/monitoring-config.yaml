apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: farmagro
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/farmagro.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: backend1
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["farmagro-backend.farmagro.svc.cluster.local:8080"]

      - job_name: backend2
        metrics_path: /metrics
        static_configs:
          - targets: ["farmagro-analitico.farmagro.svc.cluster.local:8000"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

      - job_name: kafka-exporter
        static_configs:
          - targets: ["kafka-exporter.farmagro.svc.cluster.local:9308"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["farmagro"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      - job_name: cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            target_label: __metrics_path__
          - target_label: __address__
            replacement: kubernetes.default.svc:443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: farmagro
data:
  farmagro.yml: |
    groups:
      - name: farmagro
        rules:
          - alert: PodsPending
            expr: sum by (namespace) (kube_pod_status_phase{namespace="farmagro", phase="Pending"}) > 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Pods en Pending en {{ $labels.namespace }}"

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="farmagro"}[5m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "El pod {{ $labels.pod }} se reinició"

          - alert: Backend2Http5xx
            expr: sum(rate(http_requests_total{job="backend2", status=~"5.."}[1m])) > 0
            labels:
              severity: critical
            annotations:
              summary: "El backend analítico responde errores 5xx"

          - alert: KafkaConsumerLagHigh
            expr: sum(kafka_consumergroup_lag{consumergroup="farmagro-consumers"}) > 100
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Lag alto en el grupo farmagro-consumers"
