apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend1
  namespace: farmagro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend1
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
